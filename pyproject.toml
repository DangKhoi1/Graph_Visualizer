[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-visualizer"
version = "0.1.0"
description = "PyQt5 undirected graph and Hamiltonian cycle visualizer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyQt5>=5.15"]

[project.gui-scripts]
graph-visualizer = "graph_visualizer.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graph_visualizer = ["assets/*.qss", "assets/*.jpeg"]
